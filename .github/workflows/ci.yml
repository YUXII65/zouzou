name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 类型检查 / Lint / 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本跟随 package.json 的 packageManager，避免和本地写 lockfile 的 pnpm 分叉
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 生成 Prisma Client
        run: pnpm db:generate

      - name: 类型检查
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: 单元测试
        run: pnpm test

      # 起一个临时 Postgres（PGlite，内存），真跑一遍备份恢复并逐字段比对。
      # 只查行数会漏掉「顺序对了但内容没写进去」的情况。
      - name: 备份恢复往返验证
        run: pnpm db:verify:restore:fixture
